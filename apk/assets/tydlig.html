<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F1">
<title>有数</title>
<style>
  :root {
    --paper: #F6F5F1;
    --bar-bg: rgba(246, 245, 241, .85);
    --keypad-bg: rgba(242, 242, 247, .92);
    --key-bg: #FFFFFF;
    --key-bg-active: #E9E9EE;
    --key-digit: #1B1B1F;
    --key-fn: #3C3C43;
    --accent: #0A84FF;
    --hairline: rgba(60, 60, 67, .18);
    --text: #1B1B1F;
    --text-2: rgba(60, 60, 67, .6);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--paper);
    overscroll-behavior: none;
    font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto,
                 "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none;
  }
  /* ── 顶栏 ── */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    height: calc(48px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 14px 0 18px;
    background: var(--bar-bg);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    backdrop-filter: blur(18px) saturate(1.6);
    border-bottom: 0.5px solid var(--hairline);
  }
  #topbar .title { font-size: 17px; font-weight: 700; letter-spacing: .2px; color: var(--text); }
  #topbar .actions { display: flex; align-items: center; gap: 4px; }
  .icon-btn {
    width: 38px; height: 38px; border: none; background: transparent; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-size: 20px; cursor: pointer;
  }
  .icon-btn:active { background: rgba(120, 120, 128, .16); }
  .icon-btn:disabled { color: rgba(60, 60, 67, .3); }
  .icon-btn svg { width: 21px; height: 21px; }
  /* ── 键盘 ── */
  #keypad {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 6px 10px calc(10px + env(safe-area-inset-bottom));
    background: var(--keypad-bg);
    -webkit-backdrop-filter: blur(22px) saturate(1.6);
    backdrop-filter: blur(22px) saturate(1.6);
    border-top: 0.5px solid var(--hairline);
  }
  #keypad .drawer {
    display: flex; align-items: center; justify-content: flex-end;
    padding: 0 4px 6px;
  }
  #fx-toggle {
    border: none; background: transparent; color: var(--accent);
    font-family: inherit; font-size: 14px; font-weight: 700; font-style: italic;
    padding: 4px 10px; border-radius: 8px; cursor: pointer;
  }
  #fx-toggle:active { background: rgba(120,120,128,.16); }
  #fx-toggle.on { background: rgba(10,132,255,.15); }
  #sci {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    max-height: 0; overflow: hidden;
    transition: max-height .22s ease, margin-bottom .22s ease;
    margin-bottom: 0;
  }
  #sci.open { max-height: 200px; margin-bottom: 8px; }
  #sci .key { height: 42px; font-size: 17px; }
  #keypad .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .key {
    height: 50px; border: none; border-radius: 12px;
    background: var(--key-bg);
    box-shadow: 0 1px 0 rgba(0, 0, 0, .10);
    font-family: inherit; font-size: 23px; font-weight: 500;
    color: var(--key-digit); cursor: pointer;
    transition: transform .06s ease, background .06s ease;
    touch-action: manipulation;
  }
  .key:active { transform: scale(.94); background: var(--key-bg-active); box-shadow: none; }
  .key.fn { font-size: 20px; font-weight: 600; color: var(--key-fn); background: #ECECF1; }
  .key.fn:active { background: #E0E0E6; }
  .key.op { color: var(--accent); font-weight: 600; }
  .key.wide-symbol { font-size: 26px; }
  /* ── 提示条（待选第二操作数等） ── */
  #hint {
    position: fixed; top: calc(58px + env(safe-area-inset-top)); left: 50%; z-index: 9;
    transform: translateX(-50%) translateY(-6px);
    display: flex; align-items: center; gap: 8px;
    max-width: 86%;
    padding: 7px 14px; border-radius: 999px;
    background: rgba(28, 28, 30, .82); color: #fff;
    font-size: 13px; letter-spacing: .3px;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    white-space: nowrap;
  }
  #hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #hint .cancel {
    border: none; background: rgba(255,255,255,.22); color: #fff;
    width: 18px; height: 18px; border-radius: 50%;
    font-size: 12px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  /* ── Toast ── */
  #toast {
    position: fixed; top: calc(58px + env(safe-area-inset-top)); left: 50%; z-index: 11;
    transform: translateX(-50%) translateY(-4px);
    padding: 8px 16px; border-radius: 999px;
    background: rgba(28, 28, 30, .86); color: #fff;
    font-size: 13px; letter-spacing: .3px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    max-width: 86%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* ── 长按菜单（底部动作面板） ── */
  #sheet-backdrop {
    position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.32);
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  #sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
    transform: translateY(105%);
    transition: transform .24s cubic-bezier(.32,.72,.35,1);
  }
  #sheet.show { transform: translateY(0); }
  #sheet .panel {
    background: rgba(250, 250, 252, .96);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-radius: 16px; overflow: hidden;
  }
  #sheet .sheet-title {
    text-align: center; font-size: 12px; color: var(--text-2);
    padding: 10px 0 8px; border-bottom: 0.5px solid var(--hairline);
  }
  #sheet .sheet-row {
    display: block; width: 100%; border: none; background: transparent;
    font-family: inherit; font-size: 17px; color: var(--accent);
    padding: 14px 0; text-align: center; cursor: pointer;
    border-bottom: 0.5px solid var(--hairline);
  }
  #sheet .sheet-row:active { background: rgba(120,120,128,.14); }
  #sheet .sheet-row.danger { color: #FF3B30; }
  #sheet .sheet-cancel {
    display: block; width: 100%; margin-top: 8px; border: none;
    background: #fff; font-family: inherit; font-size: 17px; font-weight: 600;
    color: var(--accent); padding: 15px 0; border-radius: 16px; cursor: pointer;
  }
  #sheet .sheet-cancel:active { background: #ECECF1; }
  /* ── 首次引导 ── */
  #onboard {
    position: fixed; inset: 0; z-index: 30; display: flex;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(0,0,0,.28);
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  #onboard.show { opacity: 1; pointer-events: auto; }
  #onboard .card {
    background: #fff; border-radius: 20px; padding: 26px 24px 20px;
    max-width: 320px; width: 100%;
    box-shadow: 0 18px 50px rgba(0,0,0,.22);
  }
  #onboard h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  #onboard .sub { font-size: 12px; color: var(--text-2); margin-bottom: 16px; }
  #onboard ol { list-style: none; margin-bottom: 18px; }
  #onboard li {
    display: flex; gap: 10px; align-items: flex-start;
    font-size: 14px; line-height: 1.5; color: var(--text);
    margin-bottom: 10px;
  }
  #onboard li .no {
    flex: none; width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  #onboard .gest { font-size: 12px; color: var(--text-2); margin-bottom: 16px; }
  #onboard .go {
    display: block; width: 100%; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; font-family: inherit;
    font-size: 16px; font-weight: 700; padding: 12px 0; cursor: pointer;
  }
  #onboard .go:active { opacity: .85; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<header id="topbar">
  <div class="title">有数</div>
  <div class="actions" id="topbar-actions">
    <button class="icon-btn" id="btn-undo" title="撤销" aria-label="撤销">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button class="icon-btn" id="btn-redo" title="重做" aria-label="重做">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <button class="icon-btn" id="btn-fit" title="适应视图" aria-label="适应视图">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
    <button class="icon-btn" id="btn-trash" title="删除选中" aria-label="删除选中">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
    </button>
  </div>
</header>

<div id="hint"><span id="hint-text"></span><button class="cancel" id="hint-cancel">✕</button></div>
<div id="toast"></div>

<div id="sheet-backdrop"></div>
<div id="sheet">
  <div class="panel">
    <div class="sheet-title" id="sheet-title">数字</div>
    <button class="sheet-row" id="sh-copy">复制数值</button>
    <button class="sheet-row" id="sh-unlink">断开连接</button>
    <button class="sheet-row danger" id="sh-delete">删除</button>
  </div>
  <button class="sheet-cancel" id="sh-cancel">取消</button>
</div>

<div id="onboard">
  <div class="card">
    <h1>有数</h1>
    <div class="sub">画布计算器 · v0.2.0</div>
    <ol>
      <li><span class="no">1</span><span>点键盘，把数字放到画布上</span></li>
      <li><span class="no">2</span><span>选中数字 → 点运算符 → 再点另一个数字，结果自动连线</span></li>
      <li><span class="no">3</span><span>改动任意输入，下游结果实时联动；长按数字可复制或删除</span></li>
    </ol>
    <div class="gest">拖动空白平移 · 双指/滚轮缩放 · 长按元素更多操作</div>
    <button class="go" id="onboard-go">开始使用</button>
  </div>
</div>

<footer id="keypad">
  <div class="drawer"><button id="fx-toggle" title="科学键盘">fx</button></div>
  <div class="grid" id="sci">
    <button class="key fn" data-k="sq">x²</button>
    <button class="key fn" data-k="pow">xʸ</button>
    <button class="key fn" data-k="sqrt">√</button>
    <button class="key fn" data-k="inv">1/x</button>

    <button class="key fn" data-k="sin">sin</button>
    <button class="key fn" data-k="cos">cos</button>
    <button class="key fn" data-k="tan">tan</button>
    <button class="key fn" data-k="pct">%</button>

    <button class="key fn" data-k="ln">ln</button>
    <button class="key fn" data-k="log">log</button>
    <button class="key fn" data-k="pi">π</button>
    <button class="key fn" data-k="e">e</button>
  </div>
  <div class="grid" id="keypad-grid">
    <button class="key fn" data-k="clear">C</button>
    <button class="key fn" data-k="back">⌫</button>
    <button class="key fn op wide-symbol" data-k="^">^</button>
    <button class="key op wide-symbol" data-k="/">÷</button>

    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key op wide-symbol" data-k="*">×</button>

    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key op wide-symbol" data-k="-">−</button>

    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key op wide-symbol" data-k="+">+</button>

    <button class="key fn" data-k="sign">±</button>
    <button class="key" data-k="0">0</button>
    <button class="key" data-k=".">.</button>
    <button class="key fn" data-k="enter">⏎</button>
  </div>
</footer>

<script>
'use strict';
/* ======================================================================
 *  有数 Tydlig-style canvas calculator  ·  v0.0.1
 *  无限画布：数字摆在画布上，运算符把它们连起来，结果实时联动。
 * ====================================================================== */

const VERSION = 'v0.2.0';

/* ── 常量与配色 ── */
const COLORS = {
  paper: '#F6F5F1',
  num: '#1B1B1F',
  numEditing: '#0A84FF',
  res: '#0A84FF',
  resError: '#FF3B30',
  label: 'rgba(60,60,67,.55)',
  wire: 'rgba(60,60,67,.30)',
  wirePending: 'rgba(10,132,255,.55)',
  ring: 'rgba(10,132,255,.95)',
  ringSoft: 'rgba(10,132,255,.35)',
  ghost: 'rgba(60,60,67,.35)',
};
const FONT_STACK = '"Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif';
const OP_SYM = { '+': '+', '-': '−', '*': '×', '/': '÷', '^': '^' };
const BASE_FONT = 40;          // 数字基准字号（世界单位）
const NODE_PAD = 14;           // 命中区呼吸边距
const MAX_DIGITS = 12;         // 输入缓冲最大字符数（不含负号）

/* ── 画布与相机 ── */
const cv = document.getElementById('canvas');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const cam = { cx: 0, cy: 0, s: 1 };          // screen = (world - c) * s + viewport/2

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

const toScreen  = (x, y) => ({ x: (x - cam.cx) * cam.s + W / 2, y: (y - cam.cy) * cam.s + H / 2 });
const toWorld   = (x, y) => ({ x: (x - W / 2) / cam.s + cam.cx, y: (y - H / 2) / cam.s + cam.cy });
const clampS = s => Math.min(2.5, Math.max(0.35, s));

/* ── 状态 ── */
let nodes = [];                // 创建顺序 = 拓扑顺序（操作数总在结果之前创建）
let nextId = 1;
let selectedId = null;
let editingId = null;
let editBuf = '';              // 编辑中的字符串；null 表示该数字从未提交过值
let pendingOp = null;          // {op, first, second|null}
let editFresh = false;         // 刚进入编辑：首个数字输入替换原值
let spawnCounter = 0;
let lastPointer = { x: -1, y: -1 };

const byId = id => nodes.find(n => n.id === id);

/* ── Toast ── */
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ── 撤销 / 重做（快照式，只含节点，不含相机） ── */
const undoStack = [], redoStack = [];
const UNDO_MAX = 100;
function serializeNodes() { return JSON.stringify({ nodes, nextId }); }
function restoreNodes(json) {
  const d = JSON.parse(json);
  nodes = d.nodes;
  nextId = d.nextId;
  editingId = null; editBuf = ''; editFresh = false;
  pendingOp = null;
  if (selectedId !== null && !byId(selectedId)) selectedId = null;
  evalAll();
  updateHint(); syncToolbar(); scheduleSave();
}
function pushUndo() {
  undoStack.push(serializeNodes());
  if (undoStack.length > UNDO_MAX) undoStack.shift();
  redoStack.length = 0;
  syncToolbar();
}
function undo() {
  if (editingId !== null) commitEdit();
  if (!undoStack.length) return;
  redoStack.push(serializeNodes());
  restoreNodes(undoStack.pop());
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(serializeNodes());
  restoreNodes(redoStack.pop());
}

/* ── 自动保存 / 恢复 ── */
const SAVE_KEY = 'tydlig.canvas.v1';
let saveTimer = 0;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, nodes, nextId, cam, savedAt: Date.now() }));
    } catch (e) { /* 隐私模式等场景下静默失败 */ }
  }, 500);
}
function loadSaved() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || d.v !== 1 || !Array.isArray(d.nodes)) return false;
    nodes = d.nodes;
    nextId = d.nextId || (d.nodes.reduce((m, n) => Math.max(m, n.id), 0) + 1);
    if (d.cam && Number.isFinite(d.cam.s)) { cam.cx = d.cam.cx; cam.cy = d.cam.cy; cam.s = clampS(d.cam.s); }
    editingId = null; editBuf = ''; editFresh = false; pendingOp = null; selectedId = null;
    evalAll();
    return nodes.length > 0;
  } catch (e) { return false; }
}

/* ── 适应视图 ── */
function fitView() {
  if (nodes.length === 0) { cam.cx = 0; cam.cy = 0; cam.s = 1; scheduleSave(); return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of nodes) {
    const b = nodeBounds(n);
    x0 = Math.min(x0, b.x - b.w / 2); x1 = Math.max(x1, b.x + b.w / 2);
    y0 = Math.min(y0, b.y - b.h / 2); y1 = Math.max(y1, b.y + b.h / 2);
  }
  const pad = 90;
  const availW = W - pad * 2, availH = H - 220 - pad;   // 顶栏与键盘之间
  const s = clampS(Math.min(availW / Math.max(x1 - x0, 1), availH / Math.max(y1 - y0, 1)));
  cam.s = s;
  cam.cx = (x0 + x1) / 2;
  cam.cy = (y0 + y1) / 2 + 40 / s;                      // 视觉上移，给键盘留空间
  scheduleSave();
}

/* ── 删除选中（级联） ── */
function deleteSelection() {
  if (editingId !== null) commitEdit();
  if (pendingOp) cancelPending();
  if (selectedId === null) return;
  const n = byId(selectedId);
  pushUndo();
  const before = nodes.length;
  removeNode(selectedId, true);
  const removed = before - nodes.length;
  toast(removed > 1 ? `已删除 ${removed} 项` : '已删除');
}

/* ── 数值格式化 ── */
function fmtNum(v) {
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  if (!Number.isFinite(v)) return v > 0 ? '∞' : '-∞';
  let s;
  if (v !== 0 && (Math.abs(v) >= 1e12 || Math.abs(v) < 1e-6)) {
    s = v.toExponential(5).replace(/\.?0+e/, 'e');
  } else {
    s = String(parseFloat(v.toPrecision(12)));
  }
  return s.replace('-', '−');
}
function fmtRaw(v) {            // 编辑恢复用的原始串
  if (v === null || v === undefined || !Number.isFinite(v)) return '';
  return String(parseFloat(v.toPrecision(12)));
}
function calc(n) {
  if (n.kind !== 'res') return n.value;
  const a = byId(n.a), b = n.b !== null ? byId(n.b) : null;
  const va = a ? a.value : null, vb = b ? b.value : null;
  if (va === null || (n.b !== null && vb === null)) return null;
  if (n.b === null) return unApply(n.op, va);
  switch (n.op) {
    case '+': return va + vb;
    case '-': return va - vb;
    case '*': return va * vb;
    case '/': return vb === 0 ? null : va / vb;
    case '^': { const r = Math.pow(va, vb); return Number.isNaN(r) ? null : r; }
  }
  return null;
}
function unApply(op, v) {

/* ── 指针交互 ── */
const pointers = new Map();

  const w = toWorld(sx, sy);

    const b = nodeBounds(nodes[i]);
    if (Math.abs(w.x - b.x) <= b.w / 2 && Math.abs(w.y - b.y) <= b.h / 2) return nodes[i];

cv.addEventListener('pointerdown', e => {

  cam.s = clampS(cam.s * f);

/* 桌面：物理键盘 */
window.addEventListener('keydown', e => {
  const K = e.key;
  if (e.ctrlKey || e.metaKey) {
    const lower = K.toLowerCase();
    if (lower === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (lower === 'z' && e.shiftKey || lower === 'y') { e.preventDefault(); redo(); }

                b.w + 16 / cam.s, b.h + 16 / cam.s, 12 / cam.s);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  const label = n.kind === 'res' ? exprLabel(n) : null;
  const text = displayText(n);
  const f = nodeFont(n);
  const valueY = n.y + (label ? b.labelH / 2 : 0);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (label) {
    ctx.font = `400 12px ${FONT_STACK}`;
    ctx.fillStyle = COLORS.label;
    ctx.fillText(label, n.x, n.y - b.h / 2 + NODE_PAD + b.labelH / 2);
  }
  if (n.kind === 'num' && n.value === null && !isEditing) {
    return; // 空节点不显示（提交前由编辑态渲染）
  }
  ctx.font = f;
  let color = n.kind === 'res' ? (n.value === null ? COLORS.resError : COLORS.res) : COLORS.num;
  if (isEditing) color = COLORS.numEditing;
  ctx.fillStyle = color;
  if (text === '' && isEditing) {
    // 光标
    if (Math.floor(t / 530) % 2 === 0) {
      ctx.fillRect(n.x - 1 / cam.s, valueY - b.px * 0.55, 2 / cam.s, b.px * 1.1);
    }
  } else {
    ctx.fillText(text, n.x, valueY);
    if (isEditing && Math.floor(t / 530) % 2 === 0) {
      const tw = measure(text, f);
      ctx.fillRect(n.x + tw / 2 + 2 / cam.s, valueY - b.px * 0.55, 2 / cam.s, b.px * 1.1);
    }
  }
}
function render(t) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = COLORS.paper;
  ctx.fillRect(0, 0, W, H);

  // 世界层：应用相机变换
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(cam.s, cam.s);
  ctx.translate(-cam.cx, -cam.cy);

  // 连线（在节点下层）
  for (const n of nodes) {
    if (n.kind !== 'res') continue;
    const a = byId(n.a), b = n.b !== null ? byId(n.b) : null;
    if (!a || !b) continue;
    const err = n.value === null;
    drawWire(a, b, err ? 'rgba(255,59,48,.4)' : COLORS.wire, err);
    drawWire(b, n, err ? 'rgba(255,59,48,.4)' : COLORS.wire, err);
  }
  // 待定预览虚线
  if (pendingOp) {
    const first = byId(pendingOp.first);
    if (first) {
      const target = pendingOp.second !== null ? byId(pendingOp.second) : null;
      let tx, ty;
      if (target) { tx = target.x; ty = target.y; }
      else if (lastPointer.x >= 0) { const w = toWorld(lastPointer.x, lastPointer.y); tx = w.x; ty = w.y; }
      else { tx = first.x + 130; ty = first.y + 30; }
      drawWire(first, { x: tx, y: ty, kind: 'num', value: 0, id: -1 }, COLORS.wirePending, true);
    }
  }

  for (const n of nodes) drawNode(n, t);
  ctx.restore();

  // 空画布引导
  if (nodes.length === 0) {
    ctx.textAlign = 'center';
    ctx.fillStyle = COLORS.ghost;
    ctx.font = `400 16px ${FONT_STACK}`;
    ctx.fillText('点按键盘，把数字放到画布上', W / 2, H * 0.40);
    ctx.font = `400 13px ${FONT_STACK}`;
    ctx.fillStyle = 'rgba(60,60,67,.28)';
    ctx.fillText('选中数字后点运算符，再点另一个数字，结果会实时联动', W / 2, H * 0.40 + 26);
  }

  requestAnimationFrame(render);
}

/* ── 测试钩子（只读 + 少量驱动，正式功能不受影响） ── */
window.__TYDLIG_TEST__ = {
  version: VERSION,
  dump() {
    return {
      version: VERSION, cam: { ...cam }, selectedId, editingId, editBuf, pendingOp,
      undoLen: undoStack.length, redoLen: redoStack.length,
      nodes: nodes.map(n => ({ ...n })),
    };
  },
  fmt: fmtNum,
  key: onKey,
  undo, redo, fitView, deleteSelection,
  openSheet, closeSheet, closeOnboard, showOnboard,
  get sheetOpen() { return sheetEl.classList.contains('show'); },
  sciOpen: () => sciGrid.classList.contains('open'),
  pressSci: k => sciGrid.querySelector(`[data-k="${k}"]`).click(),
  saved() {
    try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; }
  },
  clearSaved() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} },
  tap(clientX, clientY) { handleTap(clientX, clientY, { type: hitNode(clientX, clientY) ? 'node' : 'pan', id: hitNode(clientX, clientY)?.id, moved: false }); },
};

/* ── 启动 ── */
resize();
loadSaved();          // 恢复上次画布（若有）；空值节点视为半成品丢弃
nodes = nodes.filter(n => !(n.kind === 'num' && n.value === null));
evalAll();
syncToolbar();
try { if (!localStorage.getItem(ONBOARD_KEY)) showOnboard(); } catch (e) { showOnboard(); }
requestAnimationFrame(render);
</script>
</body>
</html>
